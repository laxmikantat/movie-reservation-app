version: "3.9"

# ── Run JUST the user-service ──────────────────────────────────────────────────
# docker compose up
#
# Later, when you have all services, you'll have ONE root docker-compose.yml
# that includes all services together.

services:

  user-service:
    build: .
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app    # live reload during development

  # Celery worker — processes async tasks (if any)
  celery-worker:
    build: .
    command: celery -A config worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - user-db

  # Redis subscriber — listens to events from other services
  subscriber:
    build: .
    command: python users/subscriber.py
    env_file: .env
    depends_on:
      - redis

  # PostgreSQL — ONLY for users (its own database)
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: useruser
      POSTGRES_PASSWORD: userpass
    ports:
      - "5433:5432"    # 5433 so it doesn't clash with other DBs
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U useruser -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — shared message bus between ALL services
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  user_db_data:
